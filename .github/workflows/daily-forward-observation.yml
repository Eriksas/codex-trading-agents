name: Daily Forward Observation

# 每交易日收盘后运行 forward 观察三件套 + gate 记录器，并把状态提交回仓库。
# git 提交历史 = 前向记录的防篡改留痕（PROTOCOL_V1 不可改历史要求）。
# 两个时点均为幂等重试：19:40 主跑，21:30 兜底（BaoStock 日线更新可能偏晚）。
# 节假日由脚本内交易日守卫自动跳过。

on:
  schedule:
    - cron: "40 11 * * 1-5"   # 北京时间 19:40（工作日）
    - cron: "30 13 * * 1-5"   # 北京时间 21:30 幂等重试
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: forward-observation
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai   # 脚本用本地时间做交易日判断，固定为北京时间
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install --quiet pandas numpy pyarrow baostock efinance akshare

      - name: Bounce paper trading (update / check / settle)
        run: |
          python research/forward_paper_bounce.py update  || echo "::warning::bounce update failed"
          python research/forward_paper_bounce.py check   || echo "::warning::bounce check failed"
          python research/forward_paper_bounce.py settle  || echo "::warning::bounce settle failed"

      - name: Gate state recorder (G2/G3/G4)
        run: |
          python research/forward_gate_recorder.py || echo "::warning::gate recorder failed"

      - name: Thermometer recorder (limit-up ecology)
        env:
          FUYAO_API_KEY: ${{ secrets.FUYAO_API_KEY }}
        run: |
          python research/forward_thermometer_recorder.py || echo "::warning::thermometer recorder failed"

      - name: CB double-low recorder
        run: |
          python research/forward_cb_recorder.py || echo "::warning::cb recorder failed"

      - name: Notify on bounce trigger (Feishu)
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_RECEIVE_ID: ${{ secrets.FEISHU_RECEIVE_ID }}
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path
          import pandas as pd

          log = Path("forward_state/bounce/events_log.csv")
          if not log.exists():
              raise SystemExit(0)
          ev = pd.read_csv(log, encoding="utf-8-sig").iloc[-1]
          if not bool(ev.get("fired")):
              raise SystemExit(0)
          ledger = pd.read_csv("forward_state/bounce/signals_ledger.csv", encoding="utf-8-sig")
          picks = ledger[ledger["signal_date"] == ev["date"]]
          lines = [
              "# 恐慌反弹事件触发（forward paper，仅模拟记录）",
              "",
              f"- 信号日：{ev['date']}（中证1000 ret5={ev['ret5']:.2%}，ret60={ev['ret60']:.2%}）",
              f"- 候选 {len(picks)} 只（次日开盘模拟买入，持有5个交易日）：",
              "",
          ] + [f"- {r['name']} {r['code']}" for _, r in picks.iterrows()] + [
              "",
              "本消息为个人模拟观察提醒，不构成投资建议；执行前需人工复核。",
          ]
          Path("/tmp/forward_alert.md").write_text("\n".join(lines), encoding="utf-8")
          print("alert prepared")
          EOF
          if [ -f /tmp/forward_alert.md ]; then
            PYTHONPATH=src python -m notifier --report /tmp/forward_alert.md --mode full || echo "::warning::feishu notify failed"
          fi

      - name: Commit forward state
        run: |
          git config user.name "forward-observer[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forward_state/
          if git diff --cached --quiet; then
            echo "no state change (holiday or already recorded)"
          else
            git commit -m "chore(forward): observation $(TZ=Asia/Shanghai date +%F)"
            git pull --rebase origin main
            git push
          fi

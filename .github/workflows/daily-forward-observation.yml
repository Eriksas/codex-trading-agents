name: Daily Forward Observation

# 每交易日收盘后运行 forward 观察三件套 + gate 记录器，并把状态提交回仓库。
# git 提交历史 = 前向记录的防篡改留痕（PROTOCOL_V1 不可改历史要求）。
# 两个时点均为幂等重试：19:40 主跑，21:30 兜底（BaoStock 日线更新可能偏晚）。
# 节假日由脚本内交易日守卫自动跳过。

on:
  schedule:
    - cron: "40 11 * * 1-5"   # 北京时间 19:40（工作日）
    - cron: "30 13 * * 1-5"   # 北京时间 21:30 幂等重试
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: forward-observation
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai   # 脚本用本地时间做交易日判断，固定为北京时间
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install --quiet pandas numpy baostock efinance akshare

      - name: Bounce paper trading (update / check / settle)
        run: |
          python research/forward_paper_bounce.py update  || echo "::warning::bounce update failed"
          python research/forward_paper_bounce.py check   || echo "::warning::bounce check failed"
          python research/forward_paper_bounce.py settle  || echo "::warning::bounce settle failed"

      - name: Gate state recorder (G2/G4)
        run: |
          python research/forward_gate_recorder.py || echo "::warning::gate recorder failed"

      - name: Commit forward state
        run: |
          git config user.name "forward-observer[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forward_state/
          if git diff --cached --quiet; then
            echo "no state change (holiday or already recorded)"
          else
            git commit -m "chore(forward): observation $(TZ=Asia/Shanghai date +%F)"
            git pull --rebase origin main
            git push
          fi
